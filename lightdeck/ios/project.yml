name: Lightdeck
options:
  bundleIdPrefix: com.noahscholz
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Im Xcode unter Signing & Capabilities das eigene Team (Apple-ID) auswählen.
targets:
  Lightdeck:
    type: application
    platform: iOS
    sources:
      - path: Lightdeck
      - { path: ../app, type: folder }
      - { path: ../src, type: folder }
    info:
      path: Lightdeck/Info.plist
      properties:
        CFBundleDisplayName: Lightdeck
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSBluetoothAlwaysUsageDescription: Lightdeck steuert deine Videoleuchten per Bluetooth.
        UIApplicationSceneManifest: { UIApplicationSupportsMultipleScenes: false }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noahscholz.lightdeck
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
